[project]
name = "finalproject_Kositskaya_M26-555"
version = "0.1.0"
description = "Console application for managing a virtual currency portfolio"
readme = "README.md"
authors = [{ name = "PolinaKA" }]
requires-python = ">=3.14"
dependencies = [
    "prettytable>=3.18.0",
    "prompt>=0.4.1",
    "requests>=2.34.2",
]

[project.scripts]
project = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "valutatrade_hub"
module-root = ""

[dependency-groups]
dev = ["ruff>=0.17.3"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
extend-select = ["E501"]
select = ["E4", "E7", "E9", "F", "I"]

[tool.valutatrade]
users_file = "data/users.json"
portfolios_file = "data/portfolios.json"
rates_file = "data/rates.json"
history_file = "data/exchange_rates.json"
rates_ttl_seconds = 300
default_base_currency = "USD"
initial_usd_balance = 10000.0
logs_dir = "logs"
actions_log_filename = "actions.log"
log_date_format = "%Y-%m-%dT%H:%M:%S+00:00"
log_level = "INFO"
log_format = "%(levelname)s %(asctime)s %(message)s"
log_max_bytes = 1048576
log_backup_count = 3
parser_log_filename = "parser.log"
parser_log_level = "DEBUG"
coingecko_url = "https://api.coingecko.com/api/v3/simple/price"
exchangerate_api_url = "https://v6.exchangerate-api.com/v6"
request_timeout = 10
update_interval_seconds = 300
